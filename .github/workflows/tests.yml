name: ReqRes client and contract tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -n 2 -m "not live" --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reqres-reports-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
